<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Clean Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app. Tab switch on top, a big live clock with a progress ring, then stats, body timeline, milestones. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#dfe4dc; --fg:#15201a; --muted:#5d6b62;
  --vape:#0f9d6e; --vape-soft:#d6f2e6;
  --alc:#d9822b; --alc-soft:#f8e6d2;
  --danger:#c2410c;
  --accent:var(--vape); --accent-soft:var(--vape-soft);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#16201b; --line:#26332c; --fg:#e8f0eb; --muted:#93a39a;
  --vape:#34d399; --vape-soft:#11392b; --alc:#f5a65b; --alc-soft:#3b2814; --danger:#fb8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#16201b; --line:#26332c; --fg:#e8f0eb; --muted:#93a39a;
  --vape:#34d399; --vape-soft:#11392b; --alc:#f5a65b; --alc-soft:#3b2814; --danger:#fb8a5c; color-scheme:dark}
body.alc{--accent:var(--alc); --accent-soft:var(--alc-soft)}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:10px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}

.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ringbox{position:relative;width:min(300px,80vw);aspect-ratio:1;max-width:100%}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--accent-soft);stroke-width:14}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.days{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,96px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dayslabel{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted)}
.clock{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;margin-top:8px}
.clock small{font-size:11px;color:var(--muted);font-weight:500;margin:0 4px 0 1px}
.next{font-size:14px;color:var(--muted)}
.next b{color:var(--fg)}
.since{font-size:13px;color:var(--muted)}

.unset{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 8px;text-align:center}
.unset h2{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

h3{font-family:var(--display);font-weight:800;font-size:20px;margin:6px 0 0;letter-spacing:-.01em}
.timeline{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;margin-top:1px}
.done .dot{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-text{font-size:14px}
.done .tl-when{color:var(--accent)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:14px;padding:10px 6px;text-align:center;color:var(--muted)}
.badge .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.badge .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.badge.got{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg)}

.fact{background:var(--accent-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fact p{margin:0;font-size:15px}
.fact button{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.warn{color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.panel input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;box-sizing:border-box}
.panel p{margin:0;font-size:14px}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}

.sos{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:999px;padding:14px 20px;background:var(--fg);color:var(--bg);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ovl-title{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
.ovl-sub{color:var(--muted);max-width:32ch;margin:0}
.ovl-timer{font-family:var(--mono);font-size:20px;font-weight:700}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--accent)}
.reasons p{margin:0;font-size:14px;min-width:0}
.rdel{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.rdel.armed{font-size:12px;color:var(--danger);font-weight:600}
.addreason{display:flex;gap:8px}
.addreason textarea{resize:vertical;flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ovl-reason{background:var(--accent-soft);border-radius:16px;padding:14px 16px;max-width:36ch;display:flex;flex-direction:column;gap:6px}
.ovl-reason p{margin:0;font-weight:600}
.overlay{overflow-y:auto}
.overlay{gap:18px}
.modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.modes button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.modenote{font-size:12px;color:var(--muted);max-width:34ch;margin:-6px 0 0}
.bstage{position:relative;width:min(250px,62vw);aspect-ratio:1;max-width:100%;flex:none;display:grid;place-items:center}
@media (max-height:700px){.bstage{width:min(180px,50vw)}}
.bstage svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.btrack{fill:none;stroke:var(--line);stroke-width:2}
.barc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.blob{position:absolute;inset:8%;border-radius:50%;will-change:transform,opacity}
.blob.b3{background:var(--accent);opacity:.10}
.blob.b2{background:var(--accent);opacity:.18}
.blob.b1{background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent) 140%);box-shadow:0 0 40px -6px var(--accent)}
.bcount{position:relative;font-family:var(--mono);font-weight:700;font-size:34px;color:var(--fg);font-variant-numeric:tabular-nums}
.ovl-title{transition:opacity .35s ease}
.ovl-title.fade{opacity:0}
.sessbar{width:min(260px,70vw);height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.sessbar span{display:block;height:100%;width:0;background:var(--accent)}
@media (prefers-reduced-motion: reduce){.ring-fg,.tabs button,.ovl-title{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button id="tab-vape" role="tab" aria-selected="true" data-k="vape">Vape-frei</button>
    <button id="tab-alc" role="tab" aria-selected="false" data-k="alc">Alkoholfrei</button>
  </div>

  <section id="view"></section>
</div>

<button class="sos" id="sos">Craving? Tippen</button>

<div class="overlay" id="overlay" hidden>
  <p class="eyebrow" id="ovl-eyebrow">Craving-Modus</p>
  <div class="modes" id="modes" role="group" aria-label="Atemtechnik">
    <button data-m="calm">Ruhig 5–5</button><button data-m="sigh">Seufzer</button><button data-m="box">Box 4–4–4–4</button>
  </div>
  <p class="modenote" id="modenote"></p>
  <div class="bstage" aria-hidden="true">
    <div class="blob b3" id="b3"></div><div class="blob b2" id="b2"></div><div class="blob b1" id="b1"></div>
    <svg viewBox="0 0 200 200"><circle class="btrack" cx="100" cy="100" r="97"/><circle class="barc" id="barc" cx="100" cy="100" r="97" stroke-dasharray="609.47" stroke-dashoffset="609.47"/></svg>
    <span class="bcount" id="bcount"></span>
  </div>
  <p class="ovl-title" id="ovl-phase" aria-live="polite">Einatmen</p>
  <div class="sessbar"><span id="sessbar"></span></div>
  <p class="ovl-timer" id="ovl-timer">3:00</p>
  <p class="ovl-sub" id="ovl-sub">Ein Craving ist eine Welle. Sie wird stärker und geht dann von allein wieder weg. Atme mit dem Kreis.</p>
  <div class="ovl-reason" id="ovl-reason" hidden><span class="eyebrow">Warum du aufgehört hast</span><p id="ovl-reason-text"></p></div>
  <button class="btn" id="ovl-close">Geschafft, zurück</button>
</div>

<script>
(function(){
const KEY="clean-streak-v1";
const DEFAULT_VAPE=null;

const CFG={
  vape:{
    name:"Vape-frei", word:"vape-frei", perWeek:20,
    timeline:[
      [20*60e3,"Puls und Blutdruck sinken wieder Richtung Normal."],
      [2*3600e3,"Die Hälfte des Nikotins ist schon abgebaut."],
      [24*3600e3,"Der erste volle Tag. Das schwerste Stück Arbeit liegt am Anfang."],
      [72*3600e3,"Nikotin ist praktisch raus aus dem Blut. Tag 2 bis 3 sind oft die härtesten, danach wird es leichter."],
      [7*864e5,"Eine Woche. Schlaf und Laune pendeln sich langsam ein."],
      [14*864e5,"Geschmack und Geruch werden besser. Gut fürs Essen."],
      [28*864e5,"Die meisten Entzugssymptome sind durch. Cravings kommen seltener und kürzer."],
      [90*864e5,"Lunge erholt sich: weniger Husten, mehr Luft beim Joggen."],
      [365*864e5,"Ein Jahr. Das Nikotin hat keine Macht mehr über deinen Tag."]
    ],
    facts:[
      "Ein Craving dauert meistens nur ein paar Minuten. Wenn du es aussitzt, wird der nächste schwächer.",
      "Nikotin treibt deinen Ruhepuls hoch. Ohne läuft dein Herz beim Joggen entspannter.",
      "Nikotin macht dich nicht ruhiger. Es beruhigt nur den Entzug, den es selbst ausgelöst hat.",
      "Nach ein paar Wochen ohne Nikotin schlafen viele tiefer und wachen weniger oft auf.",
      "Jeder Tag ohne Vape trainiert dein Gehirn um. Die Verknüpfung „Stress → Vape“ wird schwächer.",
      "Dein Geld bleibt bei dir. Rechne mal aus, was nach einem Jahr da steht.",
    ]
  },
  alc:{
    name:"Alkoholfrei", word:"alkoholfrei", perWeek:15,
    timeline:[
      [24*3600e3,"Der Körper hat den letzten Alkohol abgebaut."],
      [3*864e5,"Der Schlaf wird tiefer, weil Alkohol die Tiefschlafphasen nicht mehr stört."],
      [7*864e5,"Eine Woche. Mehr Energie morgens, Haut und Magen danken es."],
      [14*864e5,"Leber kann sich erholen, die Regeneration nach dem Training wird besser."],
      [30*864e5,"Ein Monat. Gewicht, Blutdruck und Konzentration profitieren spürbar."],
      [90*864e5,"Drei Monate. Neue Gewohnheiten sind jetzt richtig verankert."]
    ],
    facts:[
      "Alkohol bremst den Muskelaufbau nach dem Training. Ohne holst du mehr aus dem Gym raus.",
      "Schon wenige Drinks machen den Schlaf flacher, auch wenn man schneller einschläft.",
      "Ein Bier hat ungefähr so viele Kalorien wie ein kleiner Snack, nur ohne Nährstoffe.",
      "Spaß haben geht auch nüchtern. Du erinnerst dich danach an alles.",
      "Weniger Alkohol bedeutet mehr Energie am nächsten Tag."
    ]
  }
};
const MILESTONES=[
  [3600e3,"1","Stunde"],[864e5,"1","Tag"],[3*864e5,"3","Tage"],[7*864e5,"1","Woche"],[14*864e5,"2","Wochen"],
  [30*864e5,"1","Monat"],[60*864e5,"2","Monate"],[100*864e5,"100","Tage"],[180*864e5,"6","Monate"],[365*864e5,"1","Jahr"]
];

const DEFAULT_REASONS=[];
let S={tab:"vape",reasons:DEFAULT_REASONS.slice(),
  vape:{start:DEFAULT_VAPE,best:0,slips:0,perWeek:CFG.vape.perWeek},
  alc:{start:null,best:0,slips:0,perWeek:CFG.alc.perWeek}};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); S={...S,...p,vape:{...S.vape,...p.vape},alc:{...S.alc,...p.alc}};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let ui={panel:null,toast:"",factIdx:{vape:0,alc:0}};
ui.factIdx.vape=Math.floor(Math.random()*CFG.vape.facts.length);
ui.factIdx.alc=Math.floor(Math.random()*CFG.alc.facts.length);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmtDur=ms=>{const d=Math.floor(ms/864e5);if(d>=1)return d+" T";const h=Math.floor(ms/3600e3);if(h>=1)return h+" Std";return Math.floor(ms/60e3)+" Min"};
const fmtDate=t=>new Date(t).toLocaleString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const toLocalInput=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const whenLabel=ms=>{if(ms<3600e3)return Math.round(ms/60e3)+" Min";if(ms<864e5)return Math.round(ms/3600e3)+" Std";if(ms<30*864e5){const d=Math.round(ms/864e5);return d+(d===1?" Tag":" Tage")}if(ms<365*864e5)return Math.round(ms/(30*864e5))+" Mon.";return "1 Jahr"};
const euro=v=>v.toLocaleString("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:v<100?2:0});

function render(){
  const k=S.tab,c=S[k],cfg=CFG[k];
  document.body.classList.toggle("alc",k==="alc");
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));
  $("#sos").textContent=k==="vape"?"Craving? Tippen":"Bock auf Drink? Tippen";
  const v=$("#view");
  if(c.start==null){
    v.innerHTML=`<div class="unset">
      <p class="eyebrow">${cfg.name}-Counter</p>
      <h2>${k==="vape"?"Seit wann bist du vape-frei?":"Seit wann trinkst du nichts mehr?"}</h2>
      <p class="note">Stell ${k==="vape"?"deinen letzten Zug":"deinen letzten Drink"} ein oder starte jetzt.</p>
      <div class="panel" style="width:100%;box-sizing:border-box;text-align:left">
        <label for="start-input">${k==="vape"?"Letzter Zug":"Letzter Drink"}
          <input id="start-input" type="datetime-local" value="${toLocalInput(Date.now())}"></label>
        <div class="actions"><button class="btn primary" id="set-start">Counter starten</button><button class="btn" id="start-now">Ab jetzt</button></div>
      </div></div>`;
    $("#set-start").onclick=()=>{const t=new Date($("#start-input").value).getTime();if(!isNaN(t)&&t<=Date.now()){c.start=t;save();render()}};
    $("#start-now").onclick=()=>{c.start=Date.now();save();render()};
    return;
  }
  const badges=MILESTONES.map(([ms,n,l])=>`<div class="badge" data-ms="${ms}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  const tl=cfg.timeline.map(([ms,t])=>`<li data-ms="${ms}"><span class="dot"></span><div><div class="tl-when">nach ${whenLabel(ms)}</div><div class="tl-text">${t}</div></div></li>`).join("");
  v.innerHTML=`
  <div class="hero">
    <p class="eyebrow">${cfg.name} seit</p>
    <div class="ringbox">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle class="ring-fg" id="ring" cx="100" cy="100" r="88" stroke-dasharray="552.92" stroke-dashoffset="552.92"/></svg>
      <div class="ringtext"><div class="days" id="days">0</div><div class="dayslabel" id="dayslabel">Tage</div>
        <div class="clock" id="clock"></div></div>
    </div>
    <p class="next" id="next"></p>
    <p class="since">Start: ${fmtDate(c.start)}</p>
  </div>
  ${ui.toast?`<div class="toast">${ui.toast}</div>`:""}
  <div class="stats">
    <div class="stat"><span class="k">Gespart</span><span class="v" id="saved">0 €</span></div>
    <div class="stat"><span class="k">Rekord</span><span class="v" id="best">–</span></div>
    <div class="stat"><span class="k">Neustarts</span><span class="v">${c.slips}</span></div>
  </div>
  <div class="fact"><p id="fact">${cfg.facts[ui.factIdx[k]]}</p><button id="nextfact">Noch ein Fakt</button></div>
  ${k==="vape"?`<h3>Meine Gründe</h3>
  <ol class="reasons" id="reasons">${S.reasons.map((r,i)=>`<li><span class="rn">${i+1}</span><p>${esc(r)}</p><button class="rdel" data-i="${i}" aria-label="Grund ${i+1} löschen">×</button></li>`).join("")}</ol>
  ${S.reasons.length?"":`<p class="note">Noch keine Gründe. Schreib auf, warum du aufhörst. Sie erscheinen auch im Craving-Modus. Mehrere auf einmal: einfach einfügen, ein Grund pro Absatz.</p>`}
  <div class="addreason"><textarea id="reason-input" rows="2" placeholder="Neuer Grund…" aria-label="Neuer Grund"></textarea><button class="btn primary" id="reason-add">Hinzufügen</button></div>
  <p class="note">Deine Gründe und Zeiten bleiben nur auf diesem Gerät gespeichert.</p>`:""}
  <h3>Was in deinem Körper passiert</h3>
  <ul class="timeline" id="tl">${tl}</ul>
  <h3>Meilensteine</h3>
  <div class="badges" id="badges">${badges}</div>
  <div class="actions">
    <button class="btn" id="open-edit">Startzeit ändern</button>
    <button class="btn" id="open-money">Kosten pro Woche</button>
    <button class="btn warn" id="open-reset">Ausrutscher</button>
  </div>
  <div id="panel"></div>`;
  $("#nextfact").onclick=()=>{ui.factIdx[k]=(ui.factIdx[k]+1)%cfg.facts.length;$("#fact").textContent=cfg.facts[ui.factIdx[k]]};
  if(k==="vape"){
    const add=()=>{const t=$("#reason-input").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(t.length){S.reasons.push(...t);save();render();}};
    $("#reason-add").onclick=add;
    document.querySelectorAll(".rdel").forEach(b=>b.onclick=()=>{
      if(b.dataset.armed){S.reasons.splice(+b.dataset.i,1);save();render();}
      else{b.dataset.armed="1";b.textContent="Löschen?";b.classList.add("armed");}});
  }
  $("#open-edit").onclick=()=>{ui.panel=ui.panel==="edit"?null:"edit";renderPanel()};
  $("#open-money").onclick=()=>{ui.panel=ui.panel==="money"?null:"money";renderPanel()};
  $("#open-reset").onclick=()=>{ui.panel=ui.panel==="reset"?null:"reset";renderPanel()};
  renderPanel();tick();
}

function renderPanel(){
  const p=$("#panel");if(!p)return;const k=S.tab,c=S[k];
  if(!ui.panel){p.innerHTML="";return}
  if(ui.panel==="edit"){
    p.innerHTML=`<div class="panel"><label for="edit-input">Neue Startzeit<input id="edit-input" type="datetime-local" value="${toLocalInput(c.start)}"></label>
      <div class="actions"><button class="btn primary" id="edit-save">Speichern</button><button class="btn" id="edit-cancel">Abbrechen</button></div>
      <p class="note">Zählt nicht als Ausrutscher. Nur zum Korrigieren.</p></div>`;
    $("#edit-save").onclick=()=>{const t=new Date($("#edit-input").value).getTime();if(!isNaN(t)&&t<=Date.now()){c.start=t;ui.panel=null;save();render()}};
    $("#edit-cancel").onclick=()=>{ui.panel=null;renderPanel()};
  }else if(ui.panel==="money"){
    p.innerHTML=`<div class="panel"><label for="money-input">Was hast du dafür pro Woche ausgegeben? (€)<input id="money-input" type="number" inputmode="decimal" min="0" step="1" value="${c.perWeek}"></label>
      <div class="actions"><button class="btn primary" id="money-save">Speichern</button></div></div>`;
    $("#money-save").onclick=()=>{const v=parseFloat($("#money-input").value);if(!isNaN(v)&&v>=0){c.perWeek=v;ui.panel=null;save();render()}};
  }else{
    const dur=Date.now()-c.start;
    p.innerHTML=`<div class="panel"><p><b>Passiert. Kein Drama.</b> Du warst ${fmtDur(dur)} ${CFG[k].word}, das bleibt als Rekord gespeichert. Ein Ausrutscher heißt nicht, dass alles umsonst war.</p>
      <div class="actions"><button class="btn primary" id="reset-yes">Neu starten ab jetzt</button><button class="btn" id="reset-no">Doch nicht</button></div></div>`;
    $("#reset-yes").onclick=()=>{c.best=Math.max(c.best,Date.now()-c.start);c.slips++;c.start=Date.now();ui.panel=null;
      ui.toast="Neuer Start. Was war der Auslöser? Wenn du ihn kennst, kannst du ihn nächstes Mal umgehen.";save();render()};
    $("#reset-no").onclick=()=>{ui.panel=null;renderPanel()};
  }
}

function tick(){
  const k=S.tab,c=S[k];if(c.start==null)return;
  const ms=Math.max(0,Date.now()-c.start);
  const d=Math.floor(ms/864e5),h=Math.floor(ms/3600e3)%24,m=Math.floor(ms/60e3)%60,s=Math.floor(ms/1e3)%60;
  const el=$("#days");if(!el)return;
  el.textContent=d;$("#dayslabel").textContent=d===1?"Tag":"Tage";
  $("#clock").innerHTML=`${pad(h)}<small>h</small>${pad(m)}<small>m</small>${pad(s)}<small>s</small>`;
  const next=MILESTONES.find(x=>x[0]>ms);const prev=[...MILESTONES].reverse().find(x=>x[0]<=ms);
  const lo=prev?prev[0]:0,hi=next?next[0]:lo||1;const frac=next?(ms-lo)/(hi-lo):1;
  $("#ring").setAttribute("stroke-dashoffset",(552.92*(1-frac)).toFixed(2));
  $("#next").innerHTML=next?`Nächster Meilenstein: <b>${next[1]} ${next[2]}</b> in ${fmtDur(next[0]-ms)}`:"<b>Alle Meilensteine geschafft.</b> Legende.";
  $("#saved").textContent=euro(c.perWeek*ms/(7*864e5));
  const best=Math.max(c.best,ms);$("#best").textContent=fmtDur(best);
  document.querySelectorAll("#badges .badge").forEach(b=>b.classList.toggle("got",+b.dataset.ms<=ms));
  let nowSet=false;
  document.querySelectorAll("#tl li").forEach(li=>{const done=+li.dataset.ms<=ms;li.classList.toggle("done",done);
    const isNow=!done&&!nowSet;li.classList.toggle("now",isNow);if(isNow)nowSet=true;
    li.querySelector(".dot").textContent=done?"✓":""});
}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;ui.panel=null;ui.toast="";save();render()});

/* Craving mode. Patterns:
   calm: NHS "Breathing exercises for stress" – in 5, out 5, no hold (~6 breaths/min)
   sigh: cyclic sighing (Balban et al. 2023, Stanford) – inhale, short second inhale, long exhale
   box:  box breathing 4-4-4-4 with holds (also tested in Balban et al.) */
const PATTERNS={
  calm:{note:"Empfohlen vom NHS: 5 Sek. ein, 5 Sek. aus, ohne Luftanhalten. Ganz ruhig und gleichmäßig.",
    ph:[["Einatmen",5,.55,1],["Ausatmen",5,1,.55]]},
  sigh:{note:"Zyklisches Seufzen (Stanford-Studie 2023): durch die Nase einatmen, kurz nachziehen, lang durch den Mund aus.",
    ph:[["Einatmen",2.5,.55,.88],["Nachziehen",1,.88,1],["Lang ausatmen",6.5,1,.55]]},
  box:{note:"Box-Atmung mit Pausen: je 4 Sek. ein, halten, aus, halten. Nur wenn sich das Halten gut anfühlt.",
    ph:[["Einatmen",4,.55,1],["Halten",4,1,1],["Ausatmen",4,1,.55],["Halten",4,.55,.55]]}
};
const SESSION=180;
const ease=x=>-(Math.cos(Math.PI*x)-1)/2;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf=null,wake=null,sess=null;
function setMode(m){
  if(!PATTERNS[m])m="calm";S.breath=m;save();
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  $("#modenote").textContent=PATTERNS[m].note;
  if(sess){sess.cycleStart=performance.now();sess.lastPhase=-1;}
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function frame(now){
  const P=PATTERNS[S.breath||"calm"].ph,cyc=P.reduce((a,x)=>a+x[1],0);
  const el=(now-sess.t0)/1000,left=Math.max(0,SESSION-el);
  let t=((now-sess.cycleStart)/1000)%cyc,i=0;
  while(t>=P[i][1]){t-=P[i][1];i++;}
  const [label,dur,a,b]=P[i],f=t/dur,sc=a+(b-a)*ease(f);
  const hold=a===b,pulse=hold?1+Math.sin(now/260)*.012:1;
  if(reduce){$("#b1").style.opacity=(.35+.65*(sc-.55)/.45).toFixed(3);}
  else{
    $("#b1").style.transform=`scale(${(sc*pulse).toFixed(4)})`;
    $("#b2").style.transform=`scale(${(.12+sc*1.0).toFixed(4)})`;
    $("#b3").style.transform=`scale(${(.2+sc*1.06).toFixed(4)})`;
  }
  $("#barc").setAttribute("stroke-dashoffset",(609.47*(1-f)).toFixed(1));
  $("#bcount").textContent=Math.ceil(dur-t);
  if(i!==sess.lastPhase){sess.lastPhase=i;const ph=$("#ovl-phase");ph.classList.add("fade");
    setTimeout(()=>{ph.textContent=label;ph.classList.remove("fade")},180);
    try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
  $("#ovl-timer").textContent=Math.floor(Math.ceil(left)/60)+":"+pad(Math.ceil(left)%60);
  $("#sessbar").style.width=(100*el/SESSION).toFixed(2)+"%";
  const rb=Math.floor(el/12);if(rb!==sess.rb){sess.rb=rb;showReason();}
  if(left<=0){endSession();return;}
  raf=requestAnimationFrame(frame);
}
function showReason(){if(S.tab==="vape"&&S.reasons.length){$("#ovl-reason-text").textContent=S.reasons[sess.ri++%S.reasons.length];}}
function endSession(){
  cancelAnimationFrame(raf);
  $("#ovl-phase").textContent="Welle vorbei";$("#bcount").textContent="✓";
  $("#b1").style.transform="scale(.8)";$("#b2").style.transform="scale(.9)";$("#b3").style.transform="scale(1)";
  $("#barc").setAttribute("stroke-dashoffset","0");$("#sessbar").style.width="100%";
  $("#ovl-sub").textContent="Stark. Jetzt was trinken, kurz raus oder duschen.";
}
$("#sos").onclick=()=>{
  $("#overlay").hidden=false;
  $("#ovl-eyebrow").textContent=S.tab==="vape"?"Craving-Modus":"Durchhalte-Modus";
  $("#ovl-sub").textContent="Ein Craving ist eine Welle. Sie wird stärker und geht dann von allein wieder weg. Atme mit dem Kreis.";
  $("#ovl-reason").hidden=!(S.tab==="vape"&&S.reasons.length);
  const now=performance.now();sess={t0:now,cycleStart:now,lastPhase:-1,rb:-1,ri:0};
  setMode(S.breath||"calm");
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
};
$("#ovl-close").onclick=()=>{cancelAnimationFrame(raf);sess=null;try{wake&&wake.release()}catch(e){}wake=null;$("#overlay").hidden=true};

render();setInterval(tick,1000);
})();
</script>

</body>
</html>
