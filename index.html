<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clean Streak">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)">
<meta name="description" content="Vape-frei- und Alkoholfrei-Counter mit Craving-Tagebuch, Sparziel und Fitness-Werten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Clean Streak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app. Three tabs (Vape, Alkohol, Fortschritt). Counter tabs: live ring, stats, reasons, plans, body timeline.
   Fortschritt: savings goal, craving diary with charts, fitness values, backup. Full-screen layers: breathing, log sheet, celebration. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#dfe4dc; --fg:#15201a; --muted:#5d6b62; --scrim:rgba(21,32,26,.45);
  --vape:#0c8a60; --vape-soft:#d6f2e6; --on-vape:#ffffff;
  --alc:#d9822b; --alc-soft:#f8e6d2; --on-alc:#2b1a08;
  --fit:#3d63dd; --fit-soft:#e3e9fb; --on-fit:#ffffff;
  --danger:#c2410c;
  /* chart marks, validated per mode (lightness band, contrast vs surface) */
  --c-vape:#0f9d6e; --c-alc:#c9731f; --c-fit:#3d63dd;
  --accent:var(--vape); --accent-soft:var(--vape-soft); --on-accent:var(--on-vape); --c-accent:var(--c-vape);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#16201b; --line:#26332c; --fg:#e8f0eb; --muted:#93a39a; --scrim:rgba(0,0,0,.62);
  --vape:#34d399; --vape-soft:#11392b; --on-vape:#0d1411;
  --alc:#f5a65b; --alc-soft:#3b2814; --on-alc:#0d1411;
  --fit:#8ea6ff; --fit-soft:#1c2645; --on-fit:#0d1411;
  --danger:#fb8a5c;
  --c-vape:#1fa577; --c-alc:#c47a2c; --c-fit:#6a86f5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#16201b; --line:#26332c; --fg:#e8f0eb; --muted:#93a39a; --scrim:rgba(0,0,0,.62);
  --vape:#34d399; --vape-soft:#11392b; --on-vape:#0d1411;
  --alc:#f5a65b; --alc-soft:#3b2814; --on-alc:#0d1411;
  --fit:#8ea6ff; --fit-soft:#1c2645; --on-fit:#0d1411;
  --danger:#fb8a5c;
  --c-vape:#1fa577; --c-alc:#c47a2c; --c-fit:#6a86f5;
  color-scheme:dark}
.th-vape{--accent:var(--vape);--accent-soft:var(--vape-soft);--on-accent:var(--on-vape);--c-accent:var(--c-vape)}
.th-alc{--accent:var(--alc);--accent-soft:var(--alc-soft);--on-accent:var(--on-alc);--c-accent:var(--c-alc)}
.th-fit{--accent:var(--fit);--accent-soft:var(--fit-soft);--on-accent:var(--on-fit);--c-accent:var(--c-fit)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 112px}
html.locked,html.locked body{overflow:hidden}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:var(--body);font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=date],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.note{font-size:13px;color:var(--muted)}
.hint{font-size:13px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sechead h3{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cardtitle{font-weight:700;font-size:15px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.flabel{font-size:13px;color:var(--muted);font-weight:600}
.formerr{color:var(--danger);font-size:13px;font-weight:600}
.formerr:empty{display:none}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .span2{grid-column:1/-1}
.formgrid.goalform{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

/* counter hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ringbox{position:relative;width:min(300px,80vw);aspect-ratio:1;max-width:100%}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--accent-soft);stroke-width:14}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.days{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,96px);line-height:.9;letter-spacing:-.03em}
.dayslabel{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted)}
.clock{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;margin-top:8px}
.clock small{font-size:11px;color:var(--muted);font-weight:500;margin:0 4px 0 1px}
.next{font-size:14px;color:var(--muted)}
.next b{color:var(--fg)}
.since{font-size:13px;color:var(--muted)}
.serie{font-size:14px;color:var(--muted)}
.serie b{color:var(--fg)}
.unset{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 0 8px;text-align:center}
.unset .card{width:100%;text-align:left}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k,.kpi .k{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.goalmini{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.gm-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.gm-top b{color:var(--fg)}
.meter{display:block;height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .6s ease}
.meter.sm{height:6px}

.fact{background:var(--accent-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.news{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.news .cardtitle{font-family:var(--display);font-size:19px;font-weight:800}
.news ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}
.news .actions{margin-top:4px}
.fact button{align-self:flex-start;border:0;background:none;padding:0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* Bilanz: clean days in the last 30 days, 90 days and since the start */
.quote{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.qbig{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qlab{font-size:14px;color:var(--muted);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.strip i{display:block;height:22px;border-radius:4px;background:var(--accent)}
.strip i.pre{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.strip i.slip{background:transparent;box-shadow:inset 0 0 0 2px var(--danger)}
.strip i.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.striplab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.sw.sq{width:10px;height:10px;border-radius:2px;background:var(--accent)}
.sw.sq.slip{background:transparent;box-shadow:inset 0 0 0 2px var(--danger)}
.qrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.qrow span:first-child{color:var(--muted)}
.lapses .tag{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}

/* reasons and plans */
.reasons,.plans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li,.plans li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.plans li{grid-template-columns:minmax(0,1fr) auto}
.rn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--accent)}
.reasons p,.plans p{font-size:14px;overflow-wrap:anywhere}
.kw{display:inline-block;font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;background:var(--accent-soft);padding:1px 6px;border-radius:6px;vertical-align:1px}
.rdel{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;min-width:28px;min-height:28px}
.rdel.armed{font-size:12px;color:var(--danger);font-weight:700;white-space:nowrap}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow textarea{flex:1;background:var(--surface)}
.planform{display:flex;flex-direction:column;gap:8px}
.planform input{background:var(--surface)}
.planform .btn{align-self:flex-start}

/* body timeline and milestones */
.timeline{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;margin-top:1px}
.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl-text{font-size:14px}
.done .tl-when{color:var(--fg)}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.badge{border:1px dashed var(--line);border-radius:12px;padding:9px 2px;text-align:center;color:var(--muted);min-width:0}
.badge .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.badge .l{font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.badge.got{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg)}

/* buttons and panels */
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{color:var(--danger)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.linkbtn.warn{color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel p{font-size:14px}

/* chips and segmented controls */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.seg.two{display:grid;grid-template-columns:1fr 1fr}
.seg button.neg[aria-pressed="true"]{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lvls button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:700;font-family:var(--mono)}
.lvls button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lvlhint{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Fortschritt */
.pagehead{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-weight:700;font-size:22px;line-height:1.25}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted);line-height:1.35}
.goalrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-name{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.goal-pct{font-weight:700;font-size:22px;white-space:nowrap}
.goal-have{font-size:14px;color:var(--muted)}
.goal-have b{color:var(--fg)}
.goal-done{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty .btn{align-self:flex-start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;flex:none}
.sw.bar{width:10px;height:10px;border-radius:2px;background:var(--c-ent)}
.sw.dot{width:9px;height:9px;border-radius:50%;background:var(--fg)}
.chartwrap{position:relative;width:100%;min-width:0}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chartwrap svg:focus{outline:none}
.chartwrap svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.bar{fill:var(--c-ent)}
.bar.hl{opacity:.7}
.slipdot{fill:var(--fg);stroke:var(--surface);stroke-width:2}
.hit{fill:transparent}
.line{fill:none;stroke:var(--c-ent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--c-ent);opacity:.1}
.pt{fill:var(--c-ent);stroke:var(--surface);stroke-width:2}
.goalline{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.mark,.cross{stroke:var(--muted);stroke-width:1}
.focusdot{fill:var(--surface);stroke:var(--c-ent);stroke-width:2.5}
.endlab{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--body)}
.tip{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:9px;font-size:12px;line-height:1.35;white-space:nowrap;pointer-events:none;display:flex;flex-direction:column;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-size:13px}
.rank{display:flex;flex-direction:column;gap:9px}
.rrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 2em;align-items:center;gap:10px;font-size:13px;line-height:1.25}
.rb{height:10px;display:block}
.rb i{display:block;height:100%;background:var(--c-ent);border-radius:0 4px 4px 0}
.rv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entries li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entries li:first-child{border-top:0;padding-top:2px}
.e-main{display:flex;flex-direction:column;min-width:0}
.e-when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.e-trg{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.e-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lvl{font-size:9px;letter-spacing:2px;color:var(--c-ent);line-height:1}
.lvl .off{color:var(--line)}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag.ok{background:var(--accent-soft)}
.tag.bad{box-shadow:inset 0 0 0 1px var(--danger);color:var(--danger)}
.ftable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ftable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:0 0 4px}
.ftable td{padding:7px 0;border-top:1px solid var(--line)}
.ftable td:last-child,.ftable th:last-child{text-align:right;width:2.4em}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
details[open] summary{margin-bottom:10px}
details .formgrid+.btn{margin-top:10px}
.code{font-family:var(--mono);font-size:16px;line-height:1.3;word-break:break-all;background:var(--bg)}
.confirm{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* SOS button and snackbar */
.sos{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:999px;padding:14px 20px;background:var(--fg);color:var(--bg);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}

/* ---------- state ---------- */
/* start: begin of the current run (since the last slip). since: very first start. lapses: slips {t: when, e: clean again from}.

function counter(perWeek){return {start:null,since:null,lapses:[],best:0,slips:0,perWeek,bank:0,cel:0}}
function defaults(){return {v:3,tab:"vape",breath:"calm",statsK:"vape",vape:counter(CFG.vape.perWeek),alc:counter(CFG.alc.perWeek),
  reasons:{vape:[],alc:[]},plans:{vape:[],alc:[]},log:[],fit:[],fitGoal:{rhr:55,vo2:55},goal:null,goalsDone:[],spent:0,backupAt:null,news:3}}
const isNum=x=>typeof x==="number"&&isFinite(x);
function migrate(p){
  const s=defaults(),legacy=[];
  if(!p||typeof p!=="object")return s;
  if(["vape","alc","stats"].includes(p.tab))s.tab=p.tab;
  if(["calm","sigh","box"].includes(p.breath))s.breath=p.breath;
  if(KS.includes(p.statsK))s.statsK=p.statsK;

  s.news=isNum(p.news)?p.news:1;
  if(isNum(p.spent)&&p.spent>0)s.spent=p.spent;
  for(const k of KS){
    const o=p[k]&&typeof p[k]==="object"?p[k]:{},c=s[k];
    if(isNum(o.start))c.start=o.start;
    for(const f of ["best","slips","bank","cel"])if(isNum(o[f])&&o[f]>=0)c[f]=o[f];
    if(isNum(o.perWeek)&&o.perWeek>=0)c.perWeek=o.perWeek;
    if(c.start==null)continue;
    c.since=isNum(o.since)&&o.since<=c.start?o.since:c.start;
    if(Array.isArray(o.lapses))c.lapses=o.lapses.filter(l=>l&&isNum(l.t)&&isNum(l.e)&&l.e>=l.t&&l.t>=c.since).map(l=>({
      id:typeof l.id==="string"?l.id:uid(),t:l.t,e:l.e,trg:typeof l.trg==="string"&&l.trg?l.trg:null}));

const fmtDur=ms=>{const d=Math.floor(ms/D);if(d>=1)return d+" T";const h=Math.floor(ms/H);if(h>=1)return h+" Std";return Math.floor(ms/MIN)+" Min"};
const fmtLeft=ms=>{const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/MIN);
  if(d>=2)return d+" Tagen"+(d<7&&h?" und "+h+" Std":"");if(d===1)return "1 Tag"+(h?" und "+h+" Std":"");
  if(h>=1)return h+" Std"+(m?" "+m+" Min":"");return Math.max(1,m)+" Min"};
const fmtLong=ms=>{const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/MIN);
  const pl=(n,a,b)=>n+" "+(n===1?a:b);if(d)return pl(d,"Tag","Tage")+(h?" und "+pl(h,"Stunde","Stunden"):"");if(h)return pl(h,"Stunde","Stunden");return pl(m,"Minute","Minuten")};
const whenLabel=ms=>{if(ms<H)return Math.round(ms/MIN)+" Min";if(ms<D)return Math.round(ms/H)+" Std";if(ms<30*D){const d=Math.round(ms/D);return d+(d===1?" Tag":" Tagen")}if(ms<365*D)return Math.round(ms/(30*D))+" Monaten";return "1 Jahr"};
const ctxK=()=>S.tab==="alc"?"alc":"vape";
function highestReached(ms){let r=null;for(const m of MILESTONES)if(m[0]<=ms)r=m;return r}
/* A slip costs at least one day, or the whole time when someone started again for a while.
   Slips that overlap count once. The cost is taken off right away, but never below the current run. */
function lostIv(c){
  const iv=c.lapses.map(l=>[Math.max(l.t,c.since),Math.max(l.e,l.t+D)]).sort((a,b)=>a[0]-b[0]),out=[];
  for(const x of iv){const p=out[out.length-1];if(p&&x[0]<=p[1])p[1]=Math.max(p[1],x[1]);else out.push(x)}
  return out;
}
function cleanOf(c,now,from){
  if(c.since==null)return 0;
  const a=Math.max(c.since,from==null?-Infinity:from);if(now<=a)return 0;
  let lost=0;for(const [lo,hi] of lostIv(c))if(hi>a)lost+=hi-Math.max(lo,a);
  return Math.max(0,now-Math.max(c.start,a),now-a-lost);
}
function recalc(c){c.lapses.sort((a,b)=>a.t-b.t);c.start=Math.max(c.since,...c.lapses.map(l=>l.e))}
function bestOf(c,now){
  let b=Math.max(+c.best||0,now-c.start),s=c.since;
  for(const l of c.lapses){b=Math.max(b,l.t-s);s=Math.max(s,l.e)}
  return b;
}
function quoteOf(c,now,days){
  const a=days?Math.max(c.since,now-days*D):c.since,span=Math.max(0,now-a),cl=cleanOf(c,now,a),n=Math.floor(span/D);
  return {n,c:Math.min(n,Math.floor(cl/D)),pct:span>0?Math.floor(cl/span*100):100};
}
function savedK(k,now){now=now||Date.now();const c=S[k];let v=+c.bank||0;if(c.since!=null)v+=(+c.perWeek||0)*cleanOf(c,now)/WK;return Math.max(0,v)}
const savedTotal=now=>savedK("vape",now)+savedK("alc",now);
const available=now=>Math.max(0,savedTotal(now)-(+S.spent||0));
const ratePerWeek=()=>KS.reduce((a,k)=>a+(S[k].start!=null?(+S[k].perWeek||0):0),0);
const logFor=k=>S.log.filter(e=>e.k===k).sort((a,b)=>b.t-a.t);
function trgInfo(k,id){
  if(!id)return null;
  if(id.startsWith("c:"))return {id,label:id.slice(2),phrase:id.slice(2)};
  const f=CFG[k].triggers.find(x=>x[0]===id);return f?{id,label:f[1],phrase:f[2]}:{id,label:id,phrase:id};
}
const blockOf=h=>{for(let i=0;i<5;i++)if(h>=BLOCKS[i][3]&&h<BLOCKS[i][4])return i;return 5};
const planText=p=>`Wenn ${p.w}, dann ${p.d}.`;
function cleanPart(s,word){return s.trim().replace(new RegExp("^"+word+"\\b[\\s,]*","i"),"").replace(/[\s.,;!]+$/,"").trim()}
function setErr(sel,msg){const e=$(sel);if(e)e.textContent=msg}
function arm(a){
  if(a.dataset.armed==="1")return true;
  $$("[data-armed='1']").forEach(b=>{b.dataset.armed="";b.textContent=b.dataset.label;b.classList.remove("armed")});
  a.dataset.label=a.textContent;a.dataset.armed="1";a.textContent="Löschen?";a.classList.add("armed");return false;
}
function pressIn(a){const g=a.parentElement;g.querySelectorAll("[aria-pressed]").forEach(b=>b.setAttribute("aria-pressed",String(b===a)))}
function syncLock(){document.documentElement.classList.toggle("locked",!$("#overlay").hidden||!$("#sheet").hidden||!$("#celebrate").hidden)}
let snackT=null;
function snack(msg,ms){const el=$("#snack");el.textContent=msg;el.hidden=false;clearTimeout(snackT);snackT=setTimeout(()=>{el.hidden=true},ms||5000)}
function clearSlip(){ui.resetLogged=null;ui.resetTime=null;ui.resetTrg=null;ui.slipKind="once";ui.slipFrom=null;ui.slipTime=null}
function syncSlip(){
  const f=$("#slip-from");if(f&&f.value)ui.slipFrom=parseLocal(f.value);
  const t=$("#slip-time");if(t&&t.value){const v=parseLocal(t.value);if(Math.abs(v-parseLocal(toLocalInput(Date.now())))>=MIN)ui.slipTime=v}
}

function bilanzSec(k){
  const c=S[k],cfg=CFG[k],now=Date.now();ui.bilDay=dayKey(now);
  const qa=quoteOf(c,now,0),long=qa.n>=30,head=long?quoteOf(c,now,30):qa;
  const big=head.n<1?`<p class="cardtitle">Dein erster Tag läuft.</p>`
    :`<p class="eyebrow">${long?"Letzte 30 Tage":"Seit Start"}</p>
      <div class="quote"><span class="qbig">${head.c} von ${head.n}</span><span class="qlab">${head.n===1?"Tag":"Tagen"} ${cfg.word}</span></div>`;
  const slipDays=new Set();
  for(const l of c.lapses){const d=new Date(l.t);d.setHours(0,0,0,0);while(d.getTime()<=l.e){slipDays.add(dayKey(d.getTime()));d.setDate(d.getDate()+1)}}
  const today=new Date();today.setHours(0,0,0,0);
  const sd=new Date(c.since);sd.setHours(0,0,0,0);
  let cells="",nSlip=0;
  for(let i=29;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);const t=d.getTime();
    const cls=t<sd.getTime()?"pre":slipDays.has(dayKey(t))?"slip":i===0?"today":"";
    if(cls==="slip")nSlip++;
    cells+=`<i class="${cls}" title="${fmtDay(t)}${cls==="slip"?": Ausrutscher":cls==="pre"?": vor dem Start":""}"></i>`;
  }
  const rows=[];
  if(qa.n>=90)rows.push(["Letzte 90 Tage",quoteOf(c,now,90)]);
  if(long)rows.push(["Seit Start",qa]);
  const L=[...c.lapses].reverse();
  const list=L.length?`<details><summary>Deine Ausrutscher (${L.length})</summary>
    <ul class="entries lapses">${L.map(l=>{const multi=l.e-l.t>=H;
      return `<li><div class="e-main"><span class="e-when">${fmtDay(l.t)} · ${fmtTime(l.t)}${multi?" bis "+fmtDay(l.e):""}</span><span class="e-trg">${l.trg?esc(trgInfo(k,l.trg).label):"Ohne Auslöser"}</span></div>
        <span class="tag">${multi?"Wieder angefangen":"Einmal"}</span>
        <button class="rdel" data-act="lapse-del" data-id="${esc(l.id)}" aria-label="Ausrutscher löschen">×</button></li>`}).join("")}</ul>
    <p class="note">Falsch eingetragen? Lösch ihn, dann zählt die Zeit wieder mit.</p></details>`:"";
  return `<section class="sec" id="sec-bilanz"><h3>Bilanz</h3><div class="card">
    ${big}
    <div class="strip" role="img" aria-label="Letzte 30 Tage: ${nSlip?nSlip+(nSlip===1?" Tag":" Tage")+" mit Ausrutscher":"kein Ausrutscher"}">${cells}</div>
    <div class="striplab" aria-hidden="true"><span>vor 30 Tagen</span><span>heute</span></div>
    ${nSlip?`<div class="legend"><span><i class="sw sq"></i>${cfg.word}</span><span><i class="sw sq slip"></i>Ausrutscher</span></div>`:""}
    ${rows.map(([l,q])=>`<div class="qrow"><span>${l}</span><span><b>${q.c} von ${q.n}</b> Tagen · ${q.pct} %</span></div>`).join("")}
    <p class="note">${L.length?"Jeder Ausrutscher kostet einen Tag, nicht alles. Mehrere kurz hintereinander zählen nur einmal."
      :"Noch kein Ausrutscher. Und falls doch einer passiert: Er kostet dich einen Tag, nicht alles."}</p>
    ${list}
  </div></section>`;
}

function breakdown(now){
  const v=savedK("vape",now),a=savedK("alc",now);
  let s=`Insgesamt gespart: <b>${euro(v+a)}</b>`;
  const parts=[];if(S.vape.start!=null||S.vape.bank)parts.push("Vape "+euro(v));if(S.alc.start!=null||S.alc.bank)parts.push("Alkohol "+euro(a));
  if(parts.length>1)s+=` (${parts.join(", ")})`;
  if(S.spent>0)s+=`. Davon schon ausgegeben: ${euro(S.spent)}`;
  return s+".";
}
function etaText(now){
  const g=S.goal;if(!g)return "";
  const rem=g.price-available(now);if(rem<=0)return "Ziel erreicht.";
  const r=ratePerWeek();if(r<=0)return "Starte einen Counter, dann rechnet die App aus, wann du es zusammen hast.";
  const t=now+rem/r*WK;
  return `Bei deinem Tempo (${euro(r)} pro Woche) hast du es am <b>${new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}</b> zusammen.`;
}
function goalCard(){
  const g=S.goal,now=Date.now();
  const done=S.goalsDone.length?`<p class="note">Schon gegönnt: ${S.goalsDone.map(x=>esc(x.name)+" ("+euro(x.price)+")").join(", ")}</p>`:"";
  const brk=`<p class="note" id="g-brk">${breakdown(now)}</p>`;
  if(!g||ui.goalEdit){
    ui.goalReached=null;
    return `<p class="eyebrow">Sparziel</p>
      <p class="cardtitle">${g?"Ziel ändern":"Wofür sparst du?"}</p>
      <div class="formgrid goalform">
        <label for="goal-name">Was?<input id="goal-name" type="text" maxlength="40" placeholder="z. B. Laufschuhe" value="${g?esc(g.name):""}" data-enter="goal-save"></label>
        <label for="goal-price">Preis (€)<input id="goal-price" type="text" inputmode="decimal" autocomplete="off" placeholder="130" value="${g?fmtAuto(g.price):""}" data-enter="goal-save"></label>
      </div>
      <p class="formerr" id="goal-err" role="alert"></p>
      <div class="actions"><button class="btn primary" data-act="goal-save">${g?"Speichern":"Ziel setzen"}</button>${g?`<button class="btn" data-act="goal-cancel">Abbrechen</button>`:""}</div>
      ${brk}${done}`;
  }
  const av=available(now),pct=Math.min(100,av/g.price*100),reached=av>=g.price;
  ui.goalReached=reached;
  return `<p class="eyebrow">Sparziel</p>

function diaryView(k){
  const L=logFor(k),now=Date.now();
  const btn=`<button class="btn primary" data-act="log-open" data-k="${k}">Craving notieren</button>`;
  if(!L.length)return `<div class="card empty"><p class="cardtitle">Noch keine Einträge.</p>
    <p class="note">Nach jedem Craving kurz notieren: wie stark, was der Auslöser war und ob du standhaft geblieben bist. Das geht auch direkt nach der Atemübung. Nach ein paar Einträgen siehst du hier deine Muster.</p>${btn}</div>`;
  const in7=e=>e.t>now-7*D,inP7=e=>e.t<=now-7*D&&e.t>now-14*D;
  const c7=L.filter(in7).length,p7=L.filter(inP7).length;
  const ok=L.filter(e=>e.ok).length,pct=Math.round(ok/L.length*100);
  const avg=a=>a.length?a.reduce((s,e)=>s+e.lvl,0)/a.length:null;
  const a7=avg(L.filter(e=>in7(e)&&e.lvl)),ap7=avg(L.filter(e=>inP7(e)&&e.lvl));
  const dl=c7-p7;
  const d7=p7||c7?(dl<0?`↓ ${-dl} weniger als Woche davor`:dl>0?`↑ ${dl} mehr als Woche davor`:"gleich wie Woche davor"):"";
  const dA=a7!=null&&ap7!=null?(a7<ap7-.05?"↓ schwächer als davor":a7>ap7+.05?"↑ stärker als davor":"wie davor"):"letzte 7 Tage";
  const slipsIn28=L.some(e=>!e.ok&&e.t>now-28*D);
  // triggers and day parts
  const tc={};L.forEach(e=>{if(e.trg)tc[e.trg]=(tc[e.trg]||0)+1});
  const trows=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id,n])=>[trgInfo(k,id).label,n]);
  const bc=BLOCKS.map(()=>0);L.forEach(e=>{bc[blockOf(new Date(e.t).getHours())]++});
  const brows=BLOCKS.map((b,i)=>[`${b[0]} (${b[1]})`,bc[i]]);
  // insight
  const ins=[];
  const topT=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
  let topB=-1;bc.forEach((n,i)=>{if(n>=2&&(topB<0||n>bc[topB]))topB=i});
  if(topT&&topT[1]>=2)ins.push(`Häufigster Auslöser: <b>${esc(trgInfo(k,topT[0]).label)}</b> (${topT[1]}×).`);
  if(topB>=0)ins.push(`Die meisten Cravings hast du <b>${BLOCKS[topB][2]} (${BLOCKS[topB][1]} Uhr)</b>.`);
  if(p7>0&&c7<p7)ins.push(`Diese Woche ${p7-c7} weniger als in der Woche davor. Es wird leichter.`);
  else if(p7>0&&c7>p7)ins.push("Diese Woche waren es mehr als davor. Das ist normal und geht wieder runter. Dranbleiben.");
  if(L.length<3)ins.push("Nach ein paar Einträgen mehr siehst du hier deine Muster.");
  const needPlan=topT&&topT[1]>=2&&!S.plans[k].some(p=>p.trg===topT[0]);
  const show=ui.logAll?L:L.slice(0,8);
  const entries=show.map(e=>{
    const t=e.trg?esc(trgInfo(k,e.trg).label):"Ohne Auslöser";
    const lvl=e.lvl?`<span class="lvl" role="img" aria-label="Stärke ${e.lvl} von 5">${"●".repeat(e.lvl)}<span class="off">${"●".repeat(5-e.lvl)}</span></span>`:"";
    return `<li><div class="e-main"><span class="e-when">${fmtDay(e.t)} · ${fmtTime(e.t)}</span><span class="e-trg">${t}</span></div>
      <div class="e-meta">${lvl}<span class="tag ${e.ok?"ok":"bad"}">${e.ok?"besiegt":"Ausrutscher"}</span></div>
      <button class="rdel" data-act="log-del" data-id="${esc(e.id)}" aria-label="Eintrag löschen">×</button></li>`;
  }).join("");
  return `
  <div class="kpis">
    <div class="kpi"><span class="k">7 Tage</span><span class="v">${c7}</span><span class="d">${d7||"Cravings"}</span></div>
    <div class="kpi"><span class="k">Besiegt</span><span class="v">${pct} %</span><span class="d">${ok} von ${L.length}</span></div>
    <div class="kpi"><span class="k">Ø Stärke</span><span class="v">${a7!=null?fmtNum(a7,1):"–"}${a7!=null?" <small>/ 5</small>":""}</span><span class="d">${dA}</span></div>
  </div>
  <div class="card">
    <div class="cardhead"><p class="cardtitle">Cravings pro Tag</p><p class="note">letzte 4 Wochen</p></div>
    ${slipsIn28?`<div class="legend"><span><i class="sw bar"></i>Cravings</span><span><i class="sw dot"></i>Tag mit Ausrutscher</span></div>`:""}
    <div class="chartwrap" id="ch-days"></div>
  </div>
  ${ins.length?`<div class="card"><p class="cardtitle">Was auffällt</p><p>${ins.join(" ")}</p>
    ${needPlan?`<button class="btn" data-act="plan-for" data-k="${k}" data-trg="${esc(topT[0])}">Wenn-Dann-Plan für „${esc(trgInfo(k,topT[0]).label)}“ anlegen</button>`:""}</div>`:""}
  <div class="card"><p class="cardtitle">Auslöser</p>
    ${trows.length?rankRows(trows):`<p class="note">Wähl beim Notieren einen Auslöser, dann siehst du hier, was dich am meisten triggert.</p>`}</div>
  <div class="card"><p class="cardtitle">Tageszeit</p>${rankRows(brows)}</div>
  <div class="card"><div class="cardhead"><p class="cardtitle">Einträge</p><p class="note">${L.length} insgesamt</p></div>
    <ul class="entries">${entries}</ul>
    ${L.length>8?`<button class="linkbtn" data-act="log-more">${ui.logAll?"Weniger anzeigen":"Alle "+L.length+" anzeigen"}</button>`:""}</div>
  ${btn}`;
}
function rankRows(rows){
  const max=Math.max(1,...rows.map(r=>r[1]));

}

function fitSeries(){
  const F=[...S.fit].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  return {F,rhr:F.filter(e=>isNum(e.rhr)).map(e=>({x:keyToTime(e.d),y:e.rhr})),vo2:F.filter(e=>isNum(e.vo2)).map(e=>({x:keyToTime(e.d),y:e.vo2}))};
}

    <details><summary>Ziele ändern</summary>
      <div class="formgrid">

/* ---------- charts ---------- */
const tipHiders=[];
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function placeTip(wrap,tip,x,y){
  tip.hidden=false;const W=wrap.clientWidth,tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(x,tw/2+2),W-tw/2-2)+"px";tip.style.top=Math.max(y-10,th+2)+"px";
}
function fillTip(tip,strong,lines){
  tip.replaceChildren();const b=document.createElement("b");b.textContent=strong;tip.append(b);
  lines.forEach(l=>{const s=document.createElement("span");s.textContent=l;tip.append(s)});
}
function drawCharts(){
  tipHiders.length=0;
  const d=$("#ch-days");if(d)dayChart(d,S.statsK);
  const {rhr,vo2}=fitSeries(),mk=S.vape.since!=null?{x:S.vape.since,label:"vape-frei"}:null;
  const r=$("#ch-rhr");if(r)lineChart(r,rhr,{goal:S.fitGoal.rhr,unit:"bpm",name:"Ruhepuls",empty:"Noch kein Ruhepuls eingetragen.",marker:mk});
  const v=$("#ch-vo2");if(v)lineChart(v,vo2,{goal:S.fitGoal.vo2,unit:"",name:"VO2max",empty:"Noch kein VO2max eingetragen.",marker:mk});
}
function dayChart(el,k){
  const w=Math.max(240,Math.floor(el.clientWidth)),h=150,m={l:24,r:4,t:16,b:22};
  const now=new Date(),B=[],idx={};
  for(let i=27;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,12);idx[dayKey(d)]=B.length;B.push({t:d.getTime(),n:0,ok:0,slip:0})}
  S.log.forEach(e=>{if(e.k!==k)return;const j=idx[dayKey(e.t)];if(j==null)return;const b=B[j];b.n++;if(e.ok)b.ok++;else b.slip++});
  const top=Math.max(2,...B.map(b=>b.n)),step=top<=4?1:top<=10?2:top<=25?5:10,yMax=Math.ceil(top/step)*step;
  const pw=w-m.l-m.r,ph=h-m.t-m.b,band=pw/28,bw=Math.max(3,Math.min(24,band-2));
  const Y=v=>m.t+ph*(1-v/yMax);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Cravings pro Tag in den letzten 4 Wochen. Die Einträge darunter zeigen alle Werte." tabindex="0">`;
  for(let v=0;v<=yMax;v+=step)s+=`<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  B.forEach((b,i)=>{
    const cx=m.l+band*(i+.5);
    if(b.n){const x=cx-bw/2,y=Y(b.n),r=Math.min(4,bw/2),y0=Y(0);
      s+=`<path class="bar" data-i="${i}" d="M${x.toFixed(2)},${y0}V${(y+r).toFixed(2)}Q${x.toFixed(2)},${y.toFixed(2)} ${(x+r).toFixed(2)},${y.toFixed(2)}H${(x+bw-r).toFixed(2)}Q${(x+bw).toFixed(2)},${y.toFixed(2)} ${(x+bw).toFixed(2)},${(y+r).toFixed(2)}V${y0}Z"/>`}
    if(b.slip)s+=`<circle class="slipdot" cx="${cx.toFixed(2)}" cy="${(Y(b.n)-8).toFixed(2)}" r="4"/>`;
  });
  [0,7,14,21].forEach(i=>{s+=`<text class="ax" x="${(m.l+band*(i+.5)).toFixed(1)}" y="${h-5}" text-anchor="${i?"middle":"start"}">${fmtDM(B[i].t)}</text>`});
  s+=`<text class="ax" x="${w-m.r}" y="${h-5}" text-anchor="end">heute</text>`;
  B.forEach((b,i)=>{s+=`<rect class="hit" data-i="${i}" x="${(m.l+band*i).toFixed(2)}" y="${m.t-12}" width="${band.toFixed(2)}" height="${ph+12}"/>`});
  el.innerHTML=s+`</svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip");let cur=-1;
  const show=i=>{
    cur=i;const b=B[i],cx=(m.l+band*(i+.5))*el.clientWidth/w;
    svg.querySelectorAll(".bar").forEach(p=>p.classList.toggle("hl",+p.dataset.i===i));
    const extra=[fmtDay(b.t)];if(b.n)extra.push(b.slip?`${b.ok} besiegt · ${b.slip} Ausrutscher`:`alle besiegt`);
    fillTip(tip,b.n===1?"1 Craving":b.n+" Cravings",extra);
    placeTip(el,tip,cx,(Y(b.n)-(b.slip?14:4))*el.clientWidth/w);
  };
  const hide=()=>{cur=-1;tip.hidden=true;svg.querySelectorAll(".bar.hl").forEach(p=>p.classList.remove("hl"))};
  const at=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*w/r.width;return Math.min(27,Math.max(0,Math.floor((x-m.l)/band)))};
  svg.addEventListener("pointermove",e=>show(at(e)));
  svg.addEventListener("pointerdown",e=>show(at(e)));
  svg.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")hide()});
  svg.addEventListener("focus",()=>{if(cur<0)show(27)});svg.addEventListener("blur",hide);
  svg.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();show(Math.max(0,(cur<0?28:cur)-1))}else if(e.key==="ArrowRight"){e.preventDefault();show(Math.min(27,cur+1))}else if(e.key==="Escape")hide()});
  tipHiders.push({el,hide});
}
function lineChart(el,pts,o){
  if(!pts.length){el.innerHTML=`<p class="note">${o.empty}</p>`;return}
  const w=Math.max(240,Math.floor(el.clientWidth)),h=170,m={l:34,r:40,t:20,b:24};
  pts=[...pts].sort((a,b)=>a.x-b.x);
  let x0=pts[0].x,x1=pts[pts.length-1].x;if(x1-x0<D){x0-=3*D;x1+=3*D}
  const vals=pts.map(p=>p.y);if(isNum(o.goal))vals.push(o.goal);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pv=Math.max(2,(hi-lo)*.15);lo-=pv;hi+=pv;
  const st=niceStep((hi-lo)/3),y0=Math.floor(lo/st)*st,y1=Math.ceil(hi/st)*st,dec=st<1?1:0;
  const pw=w-m.l-m.r,ph=h-m.t-m.b,X=t=>m.l+(t-x0)/(x1-x0)*pw,Y=v=>m.t+ph*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${o.name} im Verlauf. Die Tabelle unten zeigt alle Werte." tabindex="0">`;
  for(let v=y0;v<=y1+st*1e-6;v+=st)s+=`<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${Y(v).toFixed(2)}" y2="${Y(v).toFixed(2)}"/><text class="ax" x="${m.l-6}" y="${(Y(v)+4).toFixed(2)}" text-anchor="end">${fmtNum(v,dec)}</text>`;
  if(o.marker&&o.marker.x>=x0&&o.marker.x<=x1){const mx=X(o.marker.x),end=mx>w-90;
    s+=`<line class="mark" x1="${mx.toFixed(2)}" x2="${mx.toFixed(2)}" y1="${m.t-6}" y2="${m.t+ph}"/><text class="ax" x="${(end?mx-4:mx+4).toFixed(2)}" y="${m.t-8}" text-anchor="${end?"end":"start"}">${o.marker.label}</text>`}
  if(isNum(o.goal))s+=`<line class="goalline" x1="${m.l}" x2="${w-m.r}" y1="${Y(o.goal).toFixed(2)}" y2="${Y(o.goal).toFixed(2)}"/><text class="ax" x="${m.l+4}" y="${(Y(o.goal)-5).toFixed(2)}">Ziel ${fmtAuto(o.goal)}</text>`;
  if(pts.length>1){
    const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(2)+","+Y(p.y).toFixed(2)).join("");
    s+=`<path class="area" d="${d}L${X(pts[pts.length-1].x).toFixed(2)},${m.t+ph}L${X(pts[0].x).toFixed(2)},${m.t+ph}Z"/><path class="line" d="${d}"/>`;
  }
  pts.forEach(p=>{s+=`<circle class="pt" cx="${X(p.x).toFixed(2)}" cy="${Y(p.y).toFixed(2)}" r="4"/>`});
  const L=pts[pts.length-1];s+=`<text class="endlab" x="${(X(L.x)+9).toFixed(2)}" y="${(Y(L.y)+4).toFixed(2)}">${fmtAuto(L.y)}</text>`;
  if(pts.length>1&&dayKey(pts[0].x)!==dayKey(L.x)){s+=`<text class="ax" x="${X(pts[0].x).toFixed(2)}" y="${h-5}" text-anchor="start">${fmtDM(pts[0].x)}</text><text class="ax" x="${X(L.x).toFixed(2)}" y="${h-5}" text-anchor="end">${fmtDM(L.x)}</text>`}
  else s+=`<text class="ax" x="${X(L.x).toFixed(2)}" y="${h-5}" text-anchor="middle">${fmtDM(L.x)}</text>`;

  el.innerHTML=s+`</svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),cross=svg.querySelector(".cross"),dot=svg.querySelector(".focusdot");let cur=-1;

function tick(){
  const now=Date.now();
  if(S.tab==="stats"){liveGoal(now);return}
  const k=S.tab,c=S[k];if(c.start==null)return;
  const el=$("#days");if(!el)return;
  if(ui.bilDay!==dayKey(now)){const b=$("#sec-bilanz");if(b)b.outerHTML=bilanzSec(k)}
  const ms=cleanOf(c,now),run=Math.max(0,now-c.start);
  const sr=$("#serie");if(sr)sr.textContent=fmtLong(run);
  const d=Math.floor(ms/D),h=Math.floor(ms/H)%24,mi=Math.floor(ms/MIN)%60,se=Math.floor(ms/1e3)%60;
  el.textContent=d;$("#dayslabel").textContent=d===1?"Tag":"Tage";
  $("#clock").innerHTML=`${pad(h)}<small>h</small>${pad(mi)}<small>m</small>${pad(se)}<small>s</small>`;
  const next=MILESTONES.find(x=>x[0]>ms),prev=highestReached(ms);
  const lo=prev?prev[0]:0,frac=next?(ms-lo)/(next[0]-lo):1;
  $("#ring").setAttribute("stroke-dashoffset",(552.92*(1-frac)).toFixed(2));
  $("#next").innerHTML=next?`Nächster Meilenstein: <b>${next[1]} ${next[2]}</b> in ${fmtLeft(next[0]-ms)}`:"<b>Alle Meilensteine geschafft.</b> Legende.";
  $("#saved").textContent=euro(savedK(k,now));
  $("#best").textContent=fmtDur(bestOf(c,now));
  $$("#badges .badge").forEach(b=>b.classList.toggle("got",+b.dataset.ms<=ms));
  let nowSet=false;
  $$("#tl li").forEach(li=>{const done=+li.dataset.ms<=run;li.classList.toggle("done",done);
    const isNow=!done&&!nowSet;li.classList.toggle("now",isNow);if(isNow)nowSet=true;li.querySelector(".dot").textContent=done?"✓":""});
  if(S.goal&&$("#gm-pct")){const p=Math.min(100,available(now)/S.goal.price*100);$("#gm-pct").textContent=Math.floor(p)+" %";$("#gm-bar").style.width=p.toFixed(2)+"%"}

}
function liveGoal(now){

function confetti(){
  if(reduce)return;
  const cv=$("#confetti"),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,Hh=innerHeight;
  cv.width=W*dpr;cv.height=Hh*dpr;cv.hidden=false;const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.body),cols=["--c-vape","--c-alc","--c-fit","--vape","--alc"].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.4,y:Hh*.38,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,r:Math.random()*6,vr:(Math.random()-.5)*.35,
    w:6+Math.random()*6,h:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now(),DUR=3400;
  (function step(now){
    const el=now-t0;ctx.clearRect(0,0,W,Hh);
    P.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-el/DUR);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(el<DUR)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,Hh);cv.hidden=true}
  })(t0);
}

/* ---------- backup ---------- */
function makeCode(){
  const bytes=new TextEncoder().encode(JSON.stringify({app:"clean-streak",v:2,at:Date.now(),data:S}));
  let bin="";for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return "CS1."+btoa(bin);
}
function readCode(code){
  code=(code||"").replace(/\s+/g,"");
  if(!code)throw new Error("Füg zuerst deinen Backup-Code ein.");
  if(!code.startsWith("CS1."))throw new Error("Das ist kein Clean-Streak-Backup-Code. Er beginnt immer mit „CS1.“.");
  let j;
  try{const bin=atob(code.slice(4));j=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))))}
  catch(e){throw new Error("Der Code ist unvollständig oder beschädigt. Kopier ihn nochmal komplett.")}
  if(!j||j.app!=="clean-streak"||!j.data)throw new Error("Der Code enthält keine Clean-Streak-Daten.");
  return j;
}

/* ---------- breathing (craving mode) ----------
   calm: NHS "Breathing exercises for stress": in 5, out 5, no hold (about 6 breaths a minute)
   sigh: cyclic sighing (Balban et al. 2023, Cell Reports Medicine): inhale, short top-up inhale, long exhale
   box:  box breathing 4-4-4-4 with holds (also tested in Balban et al.) */
const PATTERNS={
  calm:{note:"Empfohlen vom NHS: 5 Sek. ein, 5 Sek. aus, ohne Luftanhalten. Ganz ruhig und gleichmäßig.",ph:[["Einatmen",5,.55,1],["Ausatmen",5,1,.55]]},
  sigh:{note:"Zyklisches Seufzen (Stanford-Studie 2023): durch die Nase einatmen, kurz nachziehen, lang durch den Mund aus.",ph:[["Einatmen",2.5,.55,.88],["Nachziehen",1,.88,1],["Lang ausatmen",6.5,1,.55]]},
  box:{note:"Box-Atmung mit Pausen: je 4 Sek. ein, halten, aus, halten. Nur wenn sich das Halten gut anfühlt.",ph:[["Einatmen",4,.55,1],["Halten",4,1,1],["Ausatmen",4,1,.55],["Halten",4,.55,.55]]}
};
const SESSION=180,ease=x=>-(Math.cos(Math.PI*x)-1)/2;
let raf=null,wake=null,sess=null;
function setMode(m){
  if(!PATTERNS[m])m="calm";S.breath=m;save();
  $$("#modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===m)));
  $("#modenote").textContent=PATTERNS[m].note;
  if(sess){sess.cycleStart=performance.now();sess.lastPhase=-1}
}
function sosItems(k){
  const r=S.reasons[k].map(t=>[CFG[k].why,t]),p=S.plans[k].map(x=>["Dein Plan",planText(x)]),out=[];
  for(let i=0;i<Math.max(r.length,p.length);i++){if(r[i])out.push(r[i]);if(p[i])out.push(p[i])}
  return out;
}
function showItem(){if(!sess||!sess.items.length)return;const it=sess.items[sess.ri++%sess.items.length];$("#ovl-item-label").textContent=it[0];$("#ovl-reason-text").textContent=it[1]}
function frame(now){
  if(!sess)return;
  const P=PATTERNS[S.breath||"calm"].ph,cyc=P.reduce((a,x)=>a+x[1],0);
  const el=(now-sess.t0)/1000,left=Math.max(0,SESSION-el);
  let t=((now-sess.cycleStart)/1000)%cyc,i=0;
  while(i<P.length-1&&t>=P[i][1]){t-=P[i][1];i++}
  const [label,dur,a,b]=P[i],f=Math.min(1,t/dur),sc=a+(b-a)*ease(f),pulse=a===b?1+Math.sin(now/260)*.012:1;
  if(reduce)$("#b1").style.opacity=(.35+.65*(sc-.55)/.45).toFixed(3);
  else{$("#b1").style.transform=`scale(${(sc*pulse).toFixed(4)})`;$("#b2").style.transform=`scale(${(.12+sc).toFixed(4)})`;$("#b3").style.transform=`scale(${(.2+sc*1.06).toFixed(4)})`}
  $("#barc").setAttribute("stroke-dashoffset",(609.47*(1-f)).toFixed(1));
  $("#bcount").textContent=Math.max(1,Math.ceil(dur-t));
  if(i!==sess.lastPhase){sess.lastPhase=i;const ph=$("#ovl-phase");ph.classList.add("fade");setTimeout(()=>{ph.textContent=label;ph.classList.remove("fade")},180);
    try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
  $("#ovl-timer").textContent=Math.floor(Math.ceil(left)/60)+":"+pad(Math.ceil(left)%60);
  $("#sessbar").style.width=Math.min(100,100*el/SESSION).toFixed(2)+"%";
  const rb=Math.floor(el/12);if(rb!==sess.rb){sess.rb=rb;showItem()}
  if(left<=0){endSession();return}
  raf=requestAnimationFrame(frame);
}
function endSession(){
  cancelAnimationFrame(raf);
  $("#ovl-phase").textContent="Welle vorbei";$("#bcount").textContent="✓";
  $("#b1").style.transform="scale(.8)";$("#b2").style.transform="scale(.9)";$("#b3").style.transform="scale(1)";
  $("#barc").setAttribute("stroke-dashoffset","0");$("#sessbar").style.width="100%";
  $("#ovl-sub").textContent="Stark. Jetzt was trinken, kurz raus oder duschen.";$("#ovl-close").textContent="Weiter";

  "slip-kind"(a){syncSlip();ui.slipKind=a.dataset.v;renderPanel()},
  "lapse-del"(a){
    if(!arm(a))return;const c=S[S.tab],now=Date.now();
    c.lapses=c.lapses.filter(l=>l.id!==a.dataset.id);recalc(c);
    const hr=highestReached(cleanOf(c,now));c.cel=Math.max(+c.cel||0,hr?hr[0]:0);save();render();snack("Ausrutscher gelöscht.");
  },
  "log-open"(a){openSheet({k:a.dataset.k||ctxK(),src:"manual"})},
  sos(){startSos()},
  mode(a){setMode(a.dataset.m)},
  "ovl-close"(){const k=sess?sess.k:ctxK();stopSos();openSheet({k,src:"sos",ok:true})},
  "sheet-k"(a){syncSheet();ui.sheet.k=a.dataset.k;ui.sheet.trg=null;renderSheet()},
  "sheet-lvl"(a){ui.sheet.lvl=+a.dataset.v;pressIn(a)},
  "sheet-trg"(a){const s=ui.sheet;s.trg=s.trg===a.dataset.v?null:a.dataset.v;$("#sheet-custom").value="";s.custom="";
    $$("#sheet-body [data-act=sheet-trg]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===s.trg)))},
  "sheet-ok"(a){ui.sheet.ok=a.dataset.v==="1";pressIn(a)},
  "sheet-save"(){saveSheet()},
  "sheet-close"(){closeSheet()},
  "stats-k"(a){S.statsK=a.dataset.k;ui.logAll=false;save();render()},
  "log-del"(a){if(!arm(a))return;S.log=S.log.filter(e=>e.id!==a.dataset.id);save();render()},
  "log-more"(){ui.logAll=!ui.logAll;render()},
  "plan-for"(a){
    const k=a.dataset.k,info=trgInfo(k,a.dataset.trg);S.tab=k;ui.panel=null;ui.planTrg=a.dataset.trg;save();render();
    const w=$("#plan-w");if(!w)return;w.value=info.phrase;$("#sec-plans").scrollIntoView({behavior:"smooth",block:"start"});
    setTimeout(()=>$("#plan-d").focus({preventScroll:true}),450);
  },
  "goal-save"(){
    const name=$("#goal-name").value.trim(),price=num($("#goal-price").value);
    if(!name){setErr("#goal-err","Gib deinem Ziel einen Namen, z. B. Laufschuhe.");return}
    if(!(price>=1)){setErr("#goal-err","Gib einen Preis in Euro ein.");return}
    S.goal={name:name.slice(0,40),price:Math.round(price*100)/100,set:S.goal?S.goal.set:Date.now()};ui.goalEdit=false;save();renderGoal();
  },
  "goal-edit"(){ui.goalEdit=true;renderGoal()},
  "goal-cancel"(){ui.goalEdit=false;renderGoal()},
  "goal-del"(a){if(!arm(a))return;S.goal=null;ui.goalEdit=false;save();renderGoal()},
  "goal-bought"(){
    const g=S.goal;if(!g||available()<g.price)return;
    S.spent=(+S.spent||0)+g.price;S.goalsDone.push({name:g.name,price:g.price,t:Date.now()});S.goal=null;save();renderGoal();confetti();
    snack(`Viel Spaß mit ${g.name}! Hast du dir verdient.`);
  },
  "fit-save"(){
    const d=$("#fit-date").value,today=dayKey(Date.now());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){setErr("#fit-err","Bitte ein Datum wählen.");return}
    if(d>today){setErr("#fit-err","Das Datum liegt in der Zukunft.");return}
    const rs=$("#fit-rhr").value.trim(),vs=$("#fit-vo2").value.trim(),rhr=rs?num(rs):null,vo2=vs?num(vs):null;
    if(rhr==null&&vo2==null){setErr("#fit-err","Trag mindestens einen Wert ein.");return}
    if(rhr!=null&&!(rhr>=30&&rhr<=130)){setErr("#fit-err","Ruhepuls bitte zwischen 30 und 130 eintragen.");return}
    if(vo2!=null&&!(vo2>=10&&vo2<=95)){setErr("#fit-err","VO2max bitte zwischen 10 und 95 eintragen.");return}
    let e=S.fit.find(x=>x.d===d);if(!e){e={d,rhr:null,vo2:null};S.fit.push(e)}
    if(rhr!=null)e.rhr=Math.round(rhr);if(vo2!=null)e.vo2=Math.round(vo2*10)/10;
    save();render();snack("Gespeichert.");
  },
  "fit-del"(a){if(!arm(a))return;S.fit=S.fit.filter(x=>x.d!==a.dataset.d);save();render()},
  "fitgoal-save"(){
    const r=num($("#goal-rhr").value),v=num($("#goal-vo2").value);
    if(!(r>=30&&r<=130)||!(v>=10&&v<=95)){setErr("#fitgoal-err","Ruhepuls-Ziel zwischen 30 und 130, VO2max-Ziel zwischen 10 und 95.");return}
    S.fitGoal={rhr:Math.round(r),vo2:Math.round(v*10)/10};save();render();snack("Ziele gespeichert.");
  },
  "backup-make"(){ui.backup=makeCode();ui.restore=null;S.backupAt=Date.now();save();renderBackup()},
  "backup-copy"(a){
    const ta=$("#backup-code"),sel=()=>{ta.focus();ta.select();a.textContent="Markiert, jetzt kopieren"};
    try{navigator.clipboard.writeText(ui.backup).then(()=>{a.textContent="Kopiert ✓";setTimeout(()=>{a.textContent="Kopieren"},2200)}).catch(sel)}catch(e){sel()}
  },
  "backup-share"(){try{navigator.share({title:"Clean Streak Backup",text:ui.backup}).catch(()=>{})}catch(e){}},
  "restore-open"(){ui.backup=null;ui.restore={step:"paste",code:"",err:""};renderBackup();const t=$("#restore-input");t&&t.focus()},
  "restore-check"(){
    const code=$("#restore-input").value;
    try{const j=readCode(code),d=migrate(j.data);
      const parts=[d.vape.start!=null?"Vape-Start "+fmtDay(d.vape.start):"kein Vape-Start",d.log.length+" Tagebuch-Einträge",d.fit.length+" Fitness-Werte",(d.reasons.vape.length+d.reasons.alc.length)+" Gründe"];
      ui.restore={step:"confirm",code,data:j.data,at:j.at,summary:parts.join(", ")+"."};
    }catch(e){ui.restore={step:"paste",code,err:e.message}}
    renderBackup();
  },
  "restore-yes"(){const r=ui.restore;if(!r||!r.data)return;const at=r.at;S=migrate(r.data);S.tab="stats";if(!S.backupAt&&isNum(at))S.backupAt=at;ui.restore=null;ui.backup=null;save();render();window.scrollTo(0,0);snack("Backup wiederhergestellt.")},
  "restore-cancel"(){ui.restore=null;renderBackup()},
  "cel-close"(){$("#celebrate").hidden=true;syncLock()},
  "news-ok"(){S.news=3;save();render()},
  "news-backup"(){S.news=3;S.tab="stats";ui.panel=null;ui.goalEdit=false;ui.restore=null;ui.backup=makeCode();S.backupAt=Date.now();save();render();
    const el=$("#sec-backup");if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:"smooth",block:"start"}))}
};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const f=ACT[a.dataset.act];if(f)f(a,e);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.enter&&ACT[e.target.dataset.enter]){e.preventDefault();ACT[e.target.dataset.enter](e.target)}
  if(e.key==="Escape"){if(!$("#celebrate").hidden)ACT["cel-close"]();else if(!$("#sheet").hidden)closeSheet()}
});
$("#snack").addEventListener("click",()=>{$("#snack").hidden=true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}

render();setInterval(tick,1000);
})();
</script>
</body>
</html>
